[workspace]
members = ["app/src-tauri", "logic", "tools"]
resolver = '3'

[workspace.package]
version = "0.1.2"
authors = [
    "Maxim Britvin<maksbritvin@gmail.com>"
]
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/DarkwingDuck48/rsproject/releases/latest"

[workspace.dependencies]
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
anyhow = "1.0.101"
thiserror = "2.0.18"
chrono = {version = "0.4.43", features = ["serde"]}
