name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # clippy и rustfmt нужны для проверок ниже: в минимальном тулчейне их нет.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Форматирование проверяем первым — это самая дешёвая проверка,
      # ей не нужны ни системные зависимости, ни собранный фронтенд.
      - name: Check formatting
        run: cargo fmt --all --check

      # Зависимости для сборки Tauri v2 на Linux (webkit2gtk и т.д.).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Фронтенд собирается в `app/dist`, который эмбедится в бинарь
      # через tauri::generate_context!() — без него приложение пустое.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      # Команды совпадают с чеклистом в CONTRIBUTING.md.
      # `--all-targets` линтует и код, и тесты; фронтенд уже собран выше,
      # потому что clippy собирает и крейт `app` (--workspace).
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace
      # Сборка release-бинаря строго с фичей custom-protocol: без неё
      # cargo build выдаёт dev-версию, которая грузит devUrl вместо ассетов.
      - run: cargo build --release -p app --features custom-protocol
