name: CI

on:
  push:
    branches: [master]
    # CI не запускается для чисто документационных/данных изменений.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "examples/**"
      - ".rules"
      - ".gitignore"
      - ".zed/**"
      - "LICENSE"
  pull_request:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "examples/**"
      - ".rules"
      - ".gitignore"
      - ".zed/**"
      - "LICENSE"

# Новый пуш в ту же ветку отменяет предыдущий прогон: очередь не копится,
# а в master всегда проверяется последнее состояние.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Какие области кода затронуты — чтобы гонять только нужные джобы.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'logic/**'
              - 'tools/**'
              - 'app/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'app/src/**'
              - 'app/package*.json'
              - 'app/vite.config.js'
              - 'app/index.html'
            workflow:
              - '.github/workflows/**'

  # Форматирование — самая дешёвая проверка: нужен только rustfmt,
  # ни системных пакетов, ни фронтенда.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  # Логика и инструменты: clippy + тесты logic/tools. Не требует ни webkit-пакетов,
  # ни сборки фронтенда — это быстрый контур обратной связи для изменений ядра.
  logic:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy (logic, tools)
        run: cargo clippy -p logic -p tools --all-targets -- -D warnings
      - name: Run tests (logic, tools)
        run: cargo test -p logic -p tools

  # Приложение: полный цикл — системные пакеты, фронтенд, workspace clippy/test
  # и release-сборка. Запускается при любых изменениях кода (rust или frontend)
  # и при изменении самих workflow-файлов.
  app:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Зависимости для сборки Tauri v2 на Linux (webkit2gtk и т.д.).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Фронтенд собирается в `app/dist`, который эмбедится в бинарь
      # через tauri::generate_context!() — без него приложение пустое.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests (workspace)
        run: cargo test --workspace
      # Сборка release-бинаря строго с фичей custom-protocol: без неё
      # cargo build выдаёт dev-версию, которая грузит devUrl вместо ассетов.
      - name: Build release binary
        run: cargo build --release -p app --features custom-protocol
