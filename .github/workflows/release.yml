name: Release

on:
  push:
    tags:
      - "v*" # срабатывает на теги вида v1.0.0, v2.1.3 и т.д.

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: rsproject
            asset_name: rsproject-linux
          - os: windows-latest
            artifact_name: rsproject.exe
            asset_name: rsproject-windows.exe
          - os: macos-latest
            artifact_name: rsproject
            asset_name: rsproject-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Зависимости для сборки Tauri v2 на Linux (webkit2gtk и т.д.).
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      # Фронтенд собирается в `app/dist`, который эмбедится в бинарь
      # через tauri::generate_context!() — без него приложение пустое.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Build release
        run: cargo build --release --workspace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir release-files
          cp artifacts/rsproject-linux/rsproject release-files/rsproject-linux
          cp artifacts/rsproject-macos/rsproject release-files/rsproject-macos
          cp artifacts/rsproject-windows.exe/rsproject.exe release-files/rsproject-windows.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
